<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VPS Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            margin-bottom: 5px;
        }

        .vps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .vps-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .vps-card h2 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 14px;
            font-weight: bold;
        }

        .info {
            margin: 10px 0;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>VPS Portal</h2>
        <span>Dashboard</span>
    </div>

    <div class="container">

        <div class="welcome">
            <h1>My VPS</h1>
            <p>Manage your virtual private servers.</p>
        </div>

        <div class="vps-grid">

            {% for server in vps_list %}

                <div class="vps-card">

                    <h2>{{ server.name }}</h2>

                    <div class="info">
                        <strong>IP Address:</strong>
                        {{ server.ip_address }}
                    </div>

                    <div class="info">
                        <strong>Plan:</strong>
                        {{ server.plan }}
                    </div>

                    <div class="info">
                        <strong>Status:</strong>
                        <span class="status">
                            {{ server.status }}
                        </span>
                    </div>

                    <a href="/vps/" class="button">
                        View VPS
                    </a>

                </div>

            {% empty %}

                <div class="empty">
                    <h2>No VPS found</h2>
                    <p>You don't have any VPS servers yet.</p>
                </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
