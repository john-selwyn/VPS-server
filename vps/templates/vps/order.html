<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order VPS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Configure Your VPS</h1>

    <p>Choose the resources for your VPS.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>VPS Name</label>
            <input
                type="text"
                name="name"
                placeholder="my-server"
                required
            >
        </div>

        <div class="form-group">
            <label>CPU</label>
            <select name="cpu" required>
                <option value="2">2 vCPU</option>
                <option value="4">4 vCPU</option>
                <option value="6">6 vCPU</option>
                <option value="8">8 vCPU</option>
            </select>
        </div>

        <div class="form-group">
            <label>RAM</label>
            <select name="ram" required>
                <option value="2">2 GB</option>
                <option value="4">4 GB</option>
                <option value="8">8 GB</option>
                <option value="16">16 GB</option>
                <option value="32">32 GB</option>
            </select>
        </div>

        <div class="form-group">
            <label>Storage</label>
            <select name="storage" required>
                <option value="32">32 GB SSD</option>
                <option value="40">40 GB SSD</option>
                <option value="64">64 GB SSD</option>
                <option value="80">80 GB SSD</option>
                <option value="100">100 GB SSD</option>
            </select>
        </div>

        <div class="form-group">
            <label>Operating System</label>
            <select name="os" required>
                <option value="Ubuntu 26.04">
                    Ubuntu 26.04
                </option>

                <option value="Ubuntu 24.04">
                    Ubuntu 24.04
                </option>

                <option value="Debian 13">
                    Debian 13
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Billing Cycle</label>
            <select name="billing" required>
                <option value="Monthly">
                    Monthly
                </option>

                <option value="Yearly">
                    Yearly
                </option>
            </select>
        </div>

        <button type="submit">
            Continue to Billing
        </button>

    </form>

</div>

</body>
</html>
